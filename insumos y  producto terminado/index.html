<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto Terminado</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div>MENU</div>
    <div class="logo">LOGIFLOW</div>
    <div>PRODUCTO TERMINADO</div>
</div>

<!-- TITULO -->
<h1 class="title">PRODUCTO TERMINADO</h1>

<!-- BOTONES DE NAVEGACIÓN -->
<div class="nav-buttons">
    <button class="nav-btn active">PRODUCTO TERMINADO</button>
    <button class="nav-btn" onclick="window.location.href='insumos.html'">INSUMOS</button>
</div>

<!-- FORM -->
<div class="container">
    <form id="productoForm">
        <div class="form-grid">
            <div class="field">
                <label>NOMBRE</label>
                <input type="text" name="nombre" required>
            </div>

            <div class="field">
                <label>UNIDAD DE MEDIDA</label>
                <input type="text" name="unidad" required>
            </div>

            <div class="field">
                <label>PESO UNITARIO (kg)</label>
                <input type="number" step="0.01" name="peso" required>
            </div>

            <div class="field">
                <label>VALOR UNITARIO ($)</label>
                <input type="number" step="0.01" name="valor" required>
            </div>

            <div class="field">
                <label>DESCRIPCIÓN</label>
                <textarea name="descripcion"></textarea>
            </div>

            <div class="btn-container">
                <button type="submit">AGREGAR</button>
            </div>
        </div>
    </form>
</div>
<!-- TABLA DE INSUMOS -->
<div class="table-container">
    <h2 class="table-title">LISTADO DE INSUMOS</h2>
    
    <!-- Filtros -->
    <div class="filters">
        <input type="text" id="searchInput" placeholder="🔍 Buscar insumo..." class="search-input">
        <select id="filterUnidad" class="filter-select">
            <option value="">Todas las unidades</option>
            <option value="kg">kg</option>
            <option value="L">L</option>
            <option value="unidades">unidades</option>
        </select>
    </div>

    <div class="table-wrapper">
        <table id="insumosTable">
            <thead>
                <tr>
                    <th>NOMBRE</th>
                    <th>UNIDAD</th>
                    <th>PESO</th>
                    <th>VALOR UNITARIO</th>
                    <th>DESCRIPCIÓN</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="10" class="empty-message">No hay insumos registrados</td>
                </tr>
            </tbody>
        </table>
    </div>
    

<script src="script.js"></script>
</body>
</html>
