<div class="main-container">
    <header class="logiflow-header">
        <span class="header-menu">MENU</span>
        <div class="header-logo">
            <span class="logo-icon">⬢</span> LOGIFLOW
        </div>
        <meta charset="UTF-8">
        <span class="header-status">EXPORTACIÓN</span> 
        <link rel="stylesheet" href="estilo.css">
        <script src="logica.js"></script>
    </header>

    <main class="content">
        <h1 class="page-title">EXPORTACIÓN</h1> 

        <form class="form-card">
            <div class="form-grid">
                <div class="field">
                    <label>FECHA</label>
                    <input type="text">
                </div>
                <div class="field">
                    <label>CANTIDAD</label>
                    <input type="number">
                </div>
                <div class="field">
                    <label>UNIDAD DE MEDIDA</label>
                    <input type="text">
                </div>
                <div class="field">
                    <label>PAIS</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>TIPO DE CAMBIO</label>
                    <input type="text">
                </div>
                <div class="field">
                    <label>VALOR EN DOLARES</label>
                    <input type="text">
                </div>
                <div class="field">
                    <label>COSTO UNITARIO</label>
                    <input type="text">
                </div>
                <div class="field">
                    <label>TIPO DE EXPO</label> 
                    <input type="text">
                </div>

                <div class="field">
                    <label>PESO NETO</label>
                    <input type="text">
                </div>
                
                <div class="field description-field">
                    <label>DESCRIPCIÓN</label>
                    <textarea rows="5"></textarea>
                </div>

                <div class="field">
                    <label>TOTAL</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>PESO BRUTO</label>
                    <input type="text">
                </div>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn-submit">SUBMITT</button>
            </div>
        </form>
    </main>
</div>
