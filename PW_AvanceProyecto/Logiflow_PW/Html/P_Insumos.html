<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insumos</title>

<!--DISEÑO CSS-->
<link rel="stylesheet" href="../Css/insumos.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div>MENU</div>
    <div class="logo">LOGIFLOW</div>
    <div>INSUMOS</div>
</div>

<!-- TITULO -->
<h1 class="title">INSUMOS</h1>

<!-- FORMULARIO DE INSUMOS -->
<div class="container">
    <form id="insumosForm">
        <div class="form-grid">
            <div class="field">
                <label>NOMBRE</label>
                <input type="text" name="nombre" required placeholder="Ej: Harina de trigo">
            </div>

            <div class="field">
                <label>UNIDAD DE MEDIDA</label>
                <input type="text" name="unidad" required placeholder="Ej: kg, L, unidades">
            </div>

            <div class="field">
                <label>PESO UNITARIO</label>
                <input type="number" step="0.01" name="cantidad" required placeholder="0.00">
            </div>

            <div class="field">
                <label>VALOR UNITARIO ($)</label>
                <input type="number" step="0.01" name="costo" required placeholder="$0.00">
            </div>

            <div class="field full-width">
                <label>DESCRIPCIÓN</label>
                <textarea name="descripcion" placeholder="Descripción del insumo..."></textarea>
            </div>

            <div class="btn-container">
                <button type="submit">AGREGAR</button>
            </div>
        </div>
    </form>
</div>

<!-- TABLA DE INSUMOS -->
<div class="table-container">
    <h2 class="table-title">LISTADO DE INSUMOS</h2>
    
    <!-- Filtros -->
    <div class="filters">
        <input type="text" id="searchInput" placeholder="🔍 Buscar insumo..." class="search-input">
        <select id="filterUnidad" class="filter-select">
            <option value="">Todas las unidades</option>
            <option value="kg">kg</option>
            <option value="L">L</option>
            <option value="unidades">unidades</option>
        </select>
    </div>

    <div class="table-wrapper">
        <table id="insumosTable">
            <thead>
                <tr>
                    <th>NOMBRE</th>
                    <th>UNIDAD</th>
                    <th>CANTIDAD</th>
                    <th>COSTO UNITARIO</th>
                    <th>VALOR TOTAL</th>
                    <th>ESTADO</th>
                    <th>DESCRIPCIÓN</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="10" class="empty-message">No hay insumos registrados</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Resumen de insumos -->
    <div class="summary">
        <div class="summary-card">
            <span class="summary-label">Total Insumos:</span>
            <span class="summary-value" id="totalInsumos">0</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Valor Total Inventario:</span>
            <span class="summary-value" id="valorTotalInventario">$0.00</span>
        </div>
        <div class="summary-card">
            <span class="summary-label">Insumos con Stock Bajo:</span>
            <span class="summary-value" id="stockBajo">0</span>
        </div>
    </div>
</div>

<!--JAVASCRIPT-->
<script src="../JavaScript/insumos.js"></script>
</body>
</html>
