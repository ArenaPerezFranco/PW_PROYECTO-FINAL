<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores</title>
    <link rel="stylesheet" href="../Css/proovedores.css"> 
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <header class="logiflow-header">
            <span class="header-menu">MENU</span>
            <div class="header-logo">
                <span class="logo-icon">⬢</span> LOGIFLOW
            </div>
            <span class="header-status">PROVEEDORES</span> 
        </header>

        <!-- Formulario Proveedores -->
        <main class="content">
            <h1 class="page-title">PROVEEDORES</h1> 

            <form id="proveedoresForm" class="form-card">
                <div class="form-grid">
                    <div class="field">
                        <label>NOMBRE</label>
                        <input type="text" name="nombre" required>
                    </div>
                    <div class="field">
                        <label>NÚMERO</label>
                        <input type="text" name="numero" required>
                    </div>
                    <div></div>

                    <div class="field">
                        <label>ENTIDAD FISCAL</label>
                        <input type="text" name="entidad_fiscal" required>
                    </div>
                    <div class="field">
                        <label>CALLE</label>
                        <input type="text" name="calle" required>
                    </div>
                    <div></div>

                    <div class="field">
                        <label>CONTACTO</label>
                        <input type="text" name="contacto">
                    </div>
                    <div class="field">
                        <label>COLONIA</label>
                        <input type="text" name="colonia">
                    </div>
                    <div class="field">
                        <label>PAÍS</label>
                        <input type="text" name="pais">
                    </div>

                    <div></div>
                    <div class="form-footer">
                        <button type="submit" class="btn-submit">AGREGAR PROVEEDOR</button>
                    </div>
                    <div></div>
                </div>
            </form>
        </main>

        <!-- Listado de Proveedores -->
        <section class="proveedores-section">
            <h2 class="section-title">LISTADO DE PROVEEDORES</h2>
            <div class="proveedores-controls">
                <input type="text" id="searchProveedor" placeholder="Buscar proveedor...">
                <select id="filterStatus">
                    <option value="">Todos</option>
                    <option value="Activo">Activos</option>
                    <option value="Inactivo">Inactivos</option>
                </select>
            </div>

            <table class="proveedores-table">
                <thead>
                    <tr>
                        <th>NOMBRE</th>
                        <th>NÚMERO</th>
                        <th>ENTIDAD FISCAL</th>
                        <th>CALLE</th>
                        <th>CONTACTO</th>
                        <th>COLONIA</th>
                        <th>PAÍS</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="proveedoresTableBody">
                    <tr>
                        <td colspan="8" class="no-data">No hay proveedores registrados</td>
                    </tr>
                </tbody>
            </table>

            <div class="proveedores-summary">
                <div>Total Proveedores: <span id="totalProveedores">0</span></div>
                <div>Proveedores Activos: <span id="proveedoresActivos">0</span></div>
                <div>Proveedores Inactivos: <span id="proveedoresInactivos">0</span></div>
            </div>
        </section>
    </div>

    <!-- Enlazar el JS -->
    <script src="proveedores.js"></script>
</body>
</html>
