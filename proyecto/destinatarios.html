<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinatarios</title>
    <link rel="stylesheet" href="destinatarios.css"> 
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <header class="logiflow-header">
            <span class="header-menu">MENU</span>
            <div class="header-logo">
                <span class="logo-icon">⬢</span> LOGIFLOW
            </div>
            <span class="header-status">DESTINATARIOS</span> 
        </header>

        <!-- Formulario Destinatarios -->
        <main class="content">
            <h1 class="page-title">DESTINATARIOS</h1> 

            <form id="destinatariosForm" class="form-card">
                <div class="form-grid">
                    <div class="field">
                        <label>NOMBRE</label>
                        <input type="text" name="nombre" required>
                    </div>
                    <div class="field">
                        <label>NÚMERO</label>
                        <input type="text" name="numero" required>
                    </div>
                    <div></div>

                    <div class="field">
                        <label>CONTACTO</label>
                        <input type="text" name="contacto" required>
                    </div>
                    <div class="field">
                        <label>CALLE</label>
                        <input type="text" name="calle" required>
                    </div>
                    <div></div>

                    <div class="field">
                        <label>COLONIA</label>
                        <input type="text" name="colonia">
                    </div>
                    <div class="field">
                        <label>PAÍS</label>
                        <input type="text" name="pais">
                    </div>
                    <div></div>

                    <div></div>
                    <div class="form-footer">
                        <button type="submit" class="btn-submit">AGREGAR DESTINATARIO</button>
                    </div>
                    <div></div>
                </div>
            </form>
        </main>

        <!-- Listado de Destinatarios -->
        <section class="destinatarios-section">
            <h2 class="section-title">LISTADO DE DESTINATARIOS</h2>
            <div class="destinatarios-controls">
                <input type="text" id="searchDestinatario" placeholder="Buscar destinatario...">
                <select id="filterStatus">
                    <option value="">Todos</option>
                    <option value="Activo">Activos</option>
                    <option value="Inactivo">Inactivos</option>
                </select>
            </div>

            <table class="destinatarios-table">
                <thead>
                    <tr>
                        <th>NOMBRE</th>
                        <th>NÚMERO</th>
                        <th>CONTACTO</th>
                        <th>CALLE</th>
                        <th>COLONIA</th>
                        <th>PAÍS</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="destinatariosTableBody">
                    <tr>
                        <td colspan="7" class="no-data">No hay destinatarios registrados</td>
                    </tr>
                </tbody>
            </table>

            <div class="destinatarios-summary">
                <div>Total Destinatarios: <span id="totalDestinatarios">0</span></div>
                <div>Destinatarios Activos: <span id="destinatariosActivos">0</span></div>
                <div>Destinatarios Inactivos: <span id="destinatariosInactivos">0</span></div>
            </div>
        </section>
    </div>

    <!-- Enlazar el JS -->
    <script src="destinatarios.js"></script>
</body>
</html>
